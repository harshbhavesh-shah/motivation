<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff3dc">
<title>Steady</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23ff6b57' stroke='%232b2140' stroke-width='2.5'/><circle cx='11.5' cy='14' r='2' fill='%232b2140'/><circle cx='20.5' cy='14' r='2' fill='%232b2140'/><path d='M11 20q5 5 10 0' stroke='%232b2140' stroke-width='2.5' fill='none' stroke-linecap='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth" id="auth" hidden>
  <div class="card">
    <div class="buddy idle" id="authBuddy"></div>
    <h1>Steady</h1>
    <p>Sign in to sync your streaks between your laptop and your phone.</p>
    <button class="btn" id="signIn">Continue with Google</button>
    <p class="tiny" id="authMsg" style="margin-top:12px"></p>
  </div>
</div>

<div class="wrap">
  <header class="top">
    <div class="hero">
      <button class="buddy idle" id="buddy" aria-label="Your buddy. Tap for a pep talk."></button>
      <div>
        <p class="eyebrow" id="dateLine"></p>
        <h1 id="greeting">Hello.</h1>
        <p class="nudge" id="nudge"></p>
      </div>
    </div>
    <div class="level" aria-label="Level progress">
      <div class="level-top"><span class="level-num" id="lvlNum">Lv 1</span><span class="level-name" id="lvlName"></span></div>
      <div class="bar"><i id="lvlBar"></i></div>
      <p class="tiny" id="lvlText"></p>
    </div>
  </header>

  <nav class="tabs">
    <button data-view="home" class="on">Today</button>
    <button data-view="food">Food</button>
    <button data-view="badges">Badges</button>
    <button data-view="rewards">Rewards</button>
    <button data-view="goals">Goals</button>
  </nav>

  <main id="home" class="view">
    <section class="grid">
      <div class="col">
        <article class="card" id="dayCard"></article>
        <article class="card" id="foodMini"></article>
        <article class="card" id="ringsCard"></article>
        <article class="card" id="weekCard"></article>
      </div>
      <div class="col">
        <article class="card" id="calCard"></article>
        <article class="card" id="rewardCard"></article>
        <article class="card" id="focusCard"></article>
      </div>
    </section>
  </main>

  <main id="food" class="view" hidden>
    <section class="grid">
      <article class="card" id="foodSummary"></article>
      <article class="card" id="foodMeals"></article>
    </section>
  </main>

  <main id="badges" class="view" hidden><article class="card" id="badgeCard"></article></main>

  <main id="rewards" class="view" hidden><article class="card" id="rewardsCard"></article></main>

  <main id="goals" class="view" hidden>
    <section class="grid">
      <article class="card" id="targetsCard"></article>
      <article class="card" id="customCard"></article>
    </section>
    <section class="card" id="ringsHelp"></section>
    <section class="card" id="calcCard"></section>
    <section class="card" id="dataCard"></section>
  </main>

  <footer class="foot tiny" id="saveState">Loading…</footer>
</div>
<dialog id="foodDlg" aria-label="Add food">
  <div class="dlg-head"><h2>Add food</h2><button class="x" data-closedlg aria-label="Close">×</button></div>
  <div class="dtabs" id="dtabs"><button data-ftab="scan">📷 Scan</button><button data-ftab="saved">Saved</button><button data-ftab="quick">Quick</button><button data-ftab="manual">By hand</button></div>

  <section id="scanPane">
    <div class="scanbox"><video id="scanVideo" playsinline muted></video><div class="reticle"></div></div>
    <p class="tiny" id="scanMsg"></p>
    <form class="add" id="codeForm"><input type="text" id="codeIn" inputmode="numeric" placeholder="or type the barcode number" aria-label="Barcode number"><button class="btn">Look up</button></form>
  </section>

  <section id="savedPane" hidden>
    <input type="text" id="savedQ" placeholder="Search your foods…" aria-label="Search saved foods">
    <div id="savedList"></div>
  </section>

  <section id="quickPane" hidden>
    <p class="tiny" style="margin:0 0 10px">No barcode? Canteen, restaurant, a friend&rsquo;s place? Log a rough estimate.</p>
    <div class="presets" id="qPresets"></div>
    <form id="quickForm">
      <div class="sub meals" id="qMeals"></div>
      <div class="field"><label for="qName">What</label><input type="text" id="qName" maxlength="60" style="width:170px"></div>
      <div class="field"><label for="qKcal">Calories<span class="tiny">Your best guess</span></label><input type="number" id="qKcal" min="1" step="any" inputmode="numeric" required></div>
      <div class="field"><label for="qP">Protein (g)<span class="tiny">Optional</span></label><input type="number" id="qP" min="0" step="any" inputmode="decimal"></div>
      <label class="save-row"><input type="checkbox" id="qSave"> Save as a one-tap preset</label>
      <p class="tiny" id="qLast" style="margin:10px 0"></p>
      <button class="btn">Add</button>
    </form>
  </section>

  <section id="manualPane" hidden>
    <form id="manualForm">
      <div class="field"><label for="mfName">Name</label><input type="text" id="mfName" maxlength="60" required style="width:170px"></div>
      <div class="field"><label for="mfBasis">Values are</label><select id="mfBasis"><option value="g">per 100 g</option><option value="unit">per serving</option></select></div>
      <div class="field"><label for="mfKcal">Calories</label><input type="number" id="mfKcal" min="0" step="any" required></div>
      <div class="field"><label for="mfP">Protein (g)</label><input type="number" id="mfP" min="0" step="any" value="0"></div>
      <div class="field"><label for="mfF">Fat (g)</label><input type="number" id="mfF" min="0" step="any" value="0"></div>
      <div class="field"><label for="mfC">Carbs (g)</label><input type="number" id="mfC" min="0" step="any" value="0"></div>
      <button class="btn" style="margin-top:10px">Next</button>
    </form>
  </section>

  <section id="pickPane" hidden><div id="pickBody"></div></section>
</dialog>
<canvas id="fx"></canvas>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
